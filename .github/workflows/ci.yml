name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        # hunt.config is included because it is sourced by hunt.sh: a stray
        # quote in the dashboard would otherwise only show up as a six-hour
        # run dying in its first second. SC2034 is disabled for it because
        # every variable in it is "unused" from that file's point of view.
        run: |
          shellcheck -x scripts/*.sh tests/*.sh
          shellcheck --shell=bash --exclude=SC2034 hunt.config

      # Plain YAML parsing does not catch Actions-level mistakes; expressions
      # have no arithmetic operators, for one, which is a silent workflow-load
      # failure with zero jobs and no log to read.
      - name: Lint workflows
        uses: rhysd/actionlint@v1.7.7

      - name: Hunt logic tests
        run: bash tests/test_hunt.sh
