name: Hunt watchdog

# The hunt keeps itself alive by chaining, which is a single point of failure:
# a cancelled run, a GitHub incident or a failed dispatch ends the chain
# silently and hunting simply stops. This restarts it.
#
# It deliberately does NOT join the ampere-hunt concurrency group, so it can
# never displace a pending chained run the way a cron on the hunt workflow did.
# It only ever dispatches when nothing is running or queued, so it cannot
# double up either.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Restart the chain if it has stopped
        uses: actions/github-script@v7
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          script: |
            const common = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'hunt.yml',
            };
            let live = 0;
            for (const status of ['in_progress', 'queued', 'waiting', 'requested', 'pending']) {
              const runs = await github.rest.actions.listWorkflowRuns({ ...common, status, per_page: 1 });
              live += runs.data.total_count;
            }
            if (live > 0) {
              core.info(`${live} hunt run(s) already running or queued; nothing to do.`);
              return;
            }
            const ref = process.env.DEFAULT_BRANCH || 'main';
            await github.rest.actions.createWorkflowDispatch({
              ...common,
              ref,
              inputs: { duration_minutes: '350', chain: 'true' },
            });
            core.notice(`No hunt was running; restarted the chain on ${ref}.`);
