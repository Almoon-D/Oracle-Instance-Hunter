name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: shellcheck -x scripts/*.sh tests/*.sh

      # Plain YAML parsing does not catch Actions-level mistakes; expressions
      # have no arithmetic operators, for one, which is a silent workflow-load
      # failure with zero jobs and no log to read.
      - name: Lint workflows
        uses: rhysd/actionlint@v1.7.7

      - name: Hunt logic tests
        run: bash tests/test_hunt.sh
